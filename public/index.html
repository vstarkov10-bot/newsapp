<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daily Briefing</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#2f8fd1" />
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Briefing" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <h1>Daily Briefing</h1>
        <div class="topbar-meta">
          <span id="lastUpdated" class="muted"></span>
          <button id="refreshBtn" class="btn">Refresh</button>
        </div>
      </div>
    </header>

    <nav class="tabs" aria-label="Sections">
      <button class="tab active" data-tab="main">Main</button>
      <button class="tab" data-tab="morning">Morning Review</button>
      <button class="tab" data-tab="evening">Evening Review</button>
    </nav>

    <main class="container">
      <div id="tabMain" class="tab-panel">
        <section class="filters">
          <div class="filter-blocks">
            <div class="filter-block">
              <span class="filter-label">Topics</span>
              <div class="filter-group" id="topicFilters" aria-label="Filter by topic (multiple allowed)"></div>
            </div>
            <div class="filter-block">
              <span class="filter-label">Sources</span>
              <div class="filter-group" id="sourceFilters" aria-label="Filter by source (multiple allowed)"></div>
            </div>
            <div class="filter-block">
              <button id="sendToClaudeBtn" class="btn btn-claude">Send to Claude</button>
            </div>
          </div>
          <div class="filter-row">
            <input
              id="searchInput"
              type="search"
              placeholder="Search headlines…"
              aria-label="Search headlines"
            />
          </div>
        </section>

        <section id="headlines" class="headlines" hidden>
          <h2 class="headlines-heading">Top Headlines</h2>
          <ol id="headlinesList" class="headlines-list"></ol>
          <p id="headlinesNote" class="headlines-note muted"></p>
        </section>

        <section id="feedErrors" class="feed-errors" hidden></section>

        <section id="results" class="results">
          <p class="muted" id="statusLine">Loading articles…</p>
          <div id="articleGrid" class="source-list"></div>
        </section>
      </div>

      <div id="tabMorning" class="tab-panel" hidden>
        <section id="morningReview" class="review-panel">
          <div class="review-header">
            <h2 class="review-heading">Morning Review <span class="review-time">7:00</span></h2>
            <button id="morningSendToClaudeBtn" class="btn btn-claude btn-small">Send to Claude</button>
          </div>
          <p id="morningReviewMeta" class="review-meta muted"></p>
          <div id="morningReviewList" class="review-list"></div>
        </section>
      </div>

      <div id="tabEvening" class="tab-panel" hidden>
        <section id="eveningReview" class="review-panel">
          <div class="review-header">
            <h2 class="review-heading">Evening Review <span class="review-time">22:00</span></h2>
            <button id="eveningSendToClaudeBtn" class="btn btn-claude btn-small">Send to Claude</button>
          </div>
          <p id="eveningReviewMeta" class="review-meta muted"></p>
          <div id="eveningReviewList" class="review-list"></div>
        </section>
      </div>
    </main>

    <footer class="footer">
      <p>
        Sources: Bloomberg, The Economist, The Washington Post, The Wall Street
        Journal. Headlines link to the original publisher.
      </p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
